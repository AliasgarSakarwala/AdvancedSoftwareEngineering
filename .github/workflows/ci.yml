# Continuous Integration: runs automatically on GitHub for every push and PR.
# If tests or Checkstyle fail, the workflow fails (red X on GitHub).

name: CI    #label showin in GitHub Actions tab

on:
  push: #Run on every push to the repository
  pull_request: #Run on every pull request to the repository

jobs:
  build:
    runs-on: ubuntu-latest  #runs on the latest Ubuntu version (a fresh Linux VM)
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 #Clone the repo in the virtual environment

      - name: Set up Java 17
        uses: actions/setup-java@v4 #Setup Java 17 in the virtual environment
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        working-directory: IndividualProject
        run: mvn -B test #Run the non interactive (-b) unit tests

      - name: Run Checkstyle
        working-directory: IndividualProject
        run: mvn -B checkstyle:check #Run the non interactive (-b) Checkstyle check to see if Code base is clean
